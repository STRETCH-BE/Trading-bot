# Trading-bot configuration.
#
# Stage 1-3 only. Nothing here enables live trading; execution config arrives
# with Stage 6 and defaults to paper regardless.

data:
  parquet_dir: data/parquet
  raw_dir: data/raw

backtest:
  starting_capital: 10000.0
  # Kraken Pro fee schedule, in basis points.
  maker_fee_bps: 16.0
  taker_fee_bps: 26.0
  # Fills happen at the next candle's open, i.e. marketable -> taker.
  fee_mode: taker
  slippage_bps: 5.0
  risk_free_rate: 0.0
  # Target-position changes below this are no-ops (fee-drift chatter guard).
  min_rebalance_delta: 0.05
  # RISK BUDGET: a strategy target of 1.0 means 'fully allocated within my
  # budget' = this fraction of equity. Matches risk.max_position_pct.
  strategy_max_allocation: 0.25
  # Candles on/after this date are HOLDOUT — backtest() raises on them.
  holdout_start: "2026-01-01"
  # NOTE: min_order_units / costmin are deliberately NOT set here. Exchange
  # minimums are per-pair and live in trading_bot.data.schema.PAIRS[...]
  # (ordermin, costmin). Setting them here would override every pair with one
  # global value.

# Stage 5b risk gate. Every order passes RiskGate.approve() or is rejected.
# A daily-loss or max-drawdown breach WRITES the HALT file, so the halt
# survives restart and only a human removes it.
risk:
  max_position_pct: 25.0
  max_total_exposure_pct: 75.0
  max_concurrent_positions: 2
  daily_loss_limit_pct: 5.0
  max_drawdown_pct: 20.0
  max_order_size_pct: 30.0
  max_orders_per_hour: 10
  stale_data_max_seconds: 300.0

strategies:
  donchian:
    entry_lookback: 20
    exit_lookback: 10
    atr_period: 14
    atr_multiple: 2.5
  # Strategy #2 (preregistration amendment 2): trend sets direction,
  # inverse realized volatility sets size.
  voltrend:
    trend_lookback: 100
    vol_lookback: 20
    target_vol: 0.40
    max_position: 1.0
  # Strategy #3 (preregistration amendment 6): mean reversion, long-or-flat.
  # entry_k / exit_e are in STANDARD DEVIATIONS of the same lookback window.
  meanrev:
    lookback: 20
    entry_k: 1.5
    exit_e: 0.0
